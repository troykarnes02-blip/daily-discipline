<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Discipline">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Daily Discipline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@600;800&display=swap">
<style>
/* Layout: one column scoreboard. Game clock on top, then streak and week, form, chart, records, 8-week log. */
:root {
  --bg: #0e1218;
  --panel: #151b24;
  --panel-2: #1c2430;
  --line: #283140;
  --ink: #ece8df;
  --dim: #9aa4b3;
  --accent: #ffb21e;
  --accent-ink: #1b1300;
  --elite: #6fd48f;
  --sharp: #4cb774;
  --ontime: #37935e;
  --late: #e8883f;
  --lost: #e0614f;
  --on-fill: #09110c;
  --good-t: #6fd48f;
  --warn-t: #f0a050;
  --bad-t: #f07a68;
  --font-display: 'Big Shoulders Display', 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif;
  --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e6e9ee; --panel: #f5f6f8; --panel-2: #dde1e8; --line: #c2c9d4;
    --ink: #131822; --dim: #566070; --accent: #b45f00; --accent-ink: #ffffff;
    --elite: #4fb879; --sharp: #79c995; --ontime: #a3d9b6; --late: #f0a15c; --lost: #e8806f;
    --on-fill: #0c1a12; --good-t: #17713b; --warn-t: #a85a00; --bad-t: #b3321f;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e6e9ee; --panel: #f5f6f8; --panel-2: #dde1e8; --line: #c2c9d4;
  --ink: #131822; --dim: #566070; --accent: #b45f00; --accent-ink: #ffffff;
  --elite: #4fb879; --sharp: #79c995; --ontime: #a3d9b6; --late: #f0a15c; --lost: #e8806f;
  --on-fill: #0c1a12; --good-t: #17713b; --warn-t: #a85a00; --bad-t: #b3321f;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-block: 16px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

/* login gate */
.gate { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; display: flex; padding: 24px 20px; padding-top: max(24px, env(safe-area-inset-top, 0px)); padding-bottom: max(24px, env(safe-area-inset-bottom, 0px)); }
.gate-in { margin: auto; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 22px; }
.gbrand h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 8.4vw, 42px); letter-spacing: .05em; line-height: 1.05; border-bottom: 3px solid var(--accent); padding-bottom: 6px; display: inline-block; max-width: 100%; }
.gbrand .tag { font-size: 12px; margin-top: 8px; }
.gform { display: flex; flex-direction: column; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
.gform .gh { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: .1em; }
.gwide { width: 100%; }
.grow { display: flex; justify-content: space-between; gap: 12px; }
.gmsg { min-height: 20px; margin: 0; color: var(--dim); font-size: 14px; border-radius: 8px; }
.gmsg.on, .gmsg.err { padding: 10px 12px; font-size: 15px; font-weight: 600; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); }
.gmsg.err { color: var(--bad-t); border-color: var(--bad-t); }
.gform .btn:disabled { opacity: .6; cursor: default; }
.gsub { margin: 0; color: var(--dim); font-size: 14px; }
.gor { text-align: center; color: var(--dim); font-size: 13px; }
.gload { color: var(--dim); margin: 0; }
/* lifting */
.lwk { display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px; gap: 8px; align-items: center; margin-bottom: 10px; }
.lwk .btn { padding: 0; font-size: 26px; line-height: 1; }
.lwk .btn[disabled] { opacity: .35; }
.lwl { text-align: center; display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
.lwl span { color: var(--dim); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.lnote { color: var(--dim); font-size: 14px; margin: 0 0 12px; }
.ldays { display: grid; gap: 4px; margin-bottom: 14px; }
.lday { display: flex; flex-direction: column; align-items: center; gap: 1px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 2px; min-height: 62px; color: var(--dim); min-width: 0; }
.lday span { font-size: 11px; letter-spacing: .1em; font-weight: 600; }
.lday b { font-family: var(--font-display); font-weight: 800; font-size: 14px; letter-spacing: .03em; line-height: 1.05; text-align: center; overflow-wrap: anywhere; }
.lday i { font-style: normal; font-size: 12px; line-height: 1; min-height: 12px; }
.lday[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.lday.done:not([aria-pressed="true"]) { color: var(--good-t); border-color: var(--good-t); }
.lday.part:not([aria-pressed="true"]) { color: var(--ink); }
.lh3 { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: .08em; margin: 4px 0 8px; }
.lh3 small { font-family: var(--font-body); font-weight: 500; font-size: 12px; letter-spacing: .06em; color: var(--dim); margin-left: 8px; }
.lwarm { margin: 0 0 12px; color: var(--dim); font-size: 14px; }
.lwarm b { color: var(--ink); }
.litem { border-top: 1px solid var(--line); padding: 12px 0 6px; display: flex; flex-direction: column; gap: 6px; }
.lhead { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; align-items: start; }
.ltag { font-family: var(--font-display); font-weight: 800; font-size: 18px; letter-spacing: .04em; color: var(--accent); }
.lname { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; min-width: 0; }
.lname b { font-size: 17px; font-weight: 600; }
.lname em { font-style: normal; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.ltgt { flex-basis: 100%; color: var(--dim); font-size: 13px; }
.lcue { margin: 0; color: var(--dim); font-size: 13px; padding-left: 42px; }
.llast { margin: 0; font-size: 13px; padding-left: 42px; color: var(--dim); }
.llast b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.lnudge { margin: 0; font-size: 13px; font-weight: 600; padding-left: 42px; color: var(--good-t); }
.lset { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; padding-left: 42px; }
.lset .sn { color: var(--dim); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.lset .x { color: var(--dim); font-size: 13px; white-space: nowrap; }
.lset input.li { padding: 8px 10px; font-size: 18px; min-width: 0; text-align: center; }
.lset input.li::placeholder { color: var(--dim); opacity: .55; }
.lset.one { grid-template-columns: 54px minmax(0, 150px); }
.lacts { display: flex; gap: 18px; padding-left: 42px; }
.lacts .link { align-self: auto; min-height: 36px; }
.lfld { margin-top: 12px; }
.lfld textarea { width: 100%; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: 500 16px var(--font-body); }
.lfinbtn { width: 100%; min-height: 52px; font-size: 17px; }
.lfin { align-self: center; }
.lprog { display: flex; flex-direction: column; }
.lpr { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.lpr:first-child { border-top: 0; }
.lpr b { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.lpr em { font-style: normal; margin-left: 8px; font-size: 12px; }
.lpr em.up { color: var(--good-t); }
.lpr em.dn { color: var(--bad-t); }
.lwu { border: 1px solid var(--line); border-radius: 10px; padding: 12px 12px 6px; margin: 0 0 14px; background: var(--panel-2); }
.lwuh { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.lwuh b { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: .1em; }
.lwuh span { color: var(--dim); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.lwu .lwarm { margin: 0 0 6px; }
.wrow { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 8px; align-items: start; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 0; color: var(--ink); min-height: 52px; }
.wrow:first-of-type { border-top: 0; }
.wrow .box { width: 28px; height: 28px; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; margin: 2px auto 0; font-weight: 800; color: var(--accent-ink); }
.wrow.on .box { background: var(--accent); border-color: var(--accent); }
.wrow.on .wt b { color: var(--dim); text-decoration: line-through; text-decoration-thickness: 1px; }
.wt { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; min-width: 0; }
.wt b { font-weight: 600; font-size: 16px; }
.wt em { font-style: normal; color: var(--accent); font-size: 14px; font-weight: 600; }
.wt small { flex-basis: 100%; color: var(--dim); font-size: 13px; }
.lramp { margin: 0; font-size: 13px; padding-left: 42px; color: var(--accent); font-weight: 600; }
.lphase { display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px; }
.lphase b { font-family: var(--font-display); font-weight: 800; font-size: 18px; letter-spacing: .1em; color: var(--accent); }
.lphase span { color: var(--dim); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.lplan { margin: 0; font-size: 15px; padding-left: 42px; color: var(--ink); }
.lplan b { font-weight: 700; font-variant-numeric: tabular-nums; }
.lplan em { font-style: normal; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 6px; }
.lchips { margin: 4px 0 10px; }
.rb { border-top: 1px solid var(--line); padding-top: 10px; }
.rb > b { display: block; margin-bottom: 8px; font-size: 16px; }
.pc { position: relative; touch-action: pan-y; border-radius: 8px; }
.pcsvg { display: block; width: 100%; height: auto; }
.pc-band { fill: var(--panel-2); opacity: .75; }
.pc-bl, .pc-xl, .pc-yl, .pc-refl { fill: var(--dim); font: 500 10px var(--font-body); }
.pc-grid { stroke: var(--line); stroke-width: 1; }
.pc-ref { stroke: var(--dim); stroke-width: 1; stroke-dasharray: 2 4; }
.pc-now { stroke: var(--dim); stroke-width: 1; stroke-dasharray: 1 3; }
.pc-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.pc-line.plan { stroke: var(--dim); stroke-dasharray: 6 4; }
.pc-line.log { stroke: var(--accent); }
.pc-mk { stroke: var(--panel); stroke-width: 2; }
.pc-mk.log { fill: var(--accent); }
.pc-ring { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.pc-hov { display: none; }
.pc.on .pc-hov { display: block; }
.pc-xh { stroke: var(--ink); stroke-width: 1; opacity: .55; }
.pc-hc { stroke: var(--panel); stroke-width: 2; }
.pc-hc.log { fill: var(--accent); }
.pc-hc.plan { fill: var(--dim); }
.pc-tip { position: absolute; top: 4px; display: none; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; line-height: 1.35; pointer-events: none; white-space: nowrap; z-index: 2; color: var(--ink); font-variant-numeric: tabular-nums; }
.pc-tip span { color: var(--dim); }
.pc.on .pc-tip { display: block; }
.pc-leg { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 4px 0 6px; font-size: 13px; color: var(--dim); }
.pc-leg span { display: inline-flex; align-items: center; gap: 6px; }
.pc-sum { margin: 0 0 8px; font-size: 14px; color: var(--dim); }
.pc-sum b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.pc-table { max-height: 280px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.pc-table table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.pc-table th { position: sticky; top: 0; background: var(--panel-2); text-align: left; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); padding: 8px 10px; }
.pc-table td { padding: 7px 10px; border-top: 1px solid var(--line); }
.pc-table tr.now td { background: var(--panel-2); font-weight: 600; }
.rbig { font-family: var(--font-display); font-weight: 800; font-size: 64px; line-height: 1; letter-spacing: .02em; font-variant-numeric: tabular-nums; margin: 2px 0 8px; }
.rgoal { margin-top: 14px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.rlist { display: flex; flex-direction: column; }
.rrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; align-items: baseline; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 0; color: var(--ink); min-height: 52px; }
.rrow:first-child { border-top: 0; }
.rrow b { font-family: var(--font-display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; grid-row: 1; grid-column: 2; }
.rrow .rd { font-weight: 600; grid-row: 1; grid-column: 1; }
.rrow .rp { color: var(--dim); font-size: 13px; grid-row: 2; grid-column: 1 / 3; }
.rrow .rn { color: var(--dim); font-size: 13px; grid-row: 3; grid-column: 1 / 3; }
.fld textarea#fb-text { min-height: 64px; }
.fblist { display: flex; flex-direction: column; margin-top: 10px; }
.fbrow { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; align-items: start; border-top: 1px solid var(--line); padding: 10px 0; }
.fbck { width: 30px; height: 30px; border-radius: 6px; border: 2px solid var(--line); background: none; display: grid; place-items: center; font-weight: 800; color: var(--accent-ink); margin-top: 2px; }
.fbrow.on .fbck { background: var(--accent); border-color: var(--accent); }
.fbt span { display: block; line-height: 1.4; overflow-wrap: anywhere; }
.fbrow.on .fbt span { color: var(--dim); text-decoration: line-through; text-decoration-thickness: 1px; }
.fbt em { display: block; font-style: normal; color: var(--dim); font-size: 12px; letter-spacing: .06em; margin-top: 2px; }
.gwk { position: fixed; inset: 0; z-index: 18; background: var(--bg); display: flex; flex-direction: column; }
.gwk[hidden] { display: none; }
.gwk-in { flex: 1; overflow-y: auto; width: 100%; max-width: 720px; margin: 0 auto; padding: 14px 16px 24px; padding-top: max(14px, env(safe-area-inset-top, 0px)); }
.gwk-act { width: 100%; max-width: 720px; margin: 0 auto; display: flex; gap: 8px; padding: 10px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--bg); }
.gwk-act .btn { min-height: 54px; }
.gwk-act .btn.primary { flex: 1; font-size: 18px; }
body.gwk-on .rest { z-index: 25; }
body.rest-on .gwk-act { padding-bottom: 100px; }
body.gwk-on { overflow: hidden; }
.gw-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; min-height: 36px; }
.gw-top b { font-family: var(--font-display); font-weight: 800; font-size: 16px; letter-spacing: .12em; }
.prof-id { display: flex; align-items: center; gap: 12px; }
.prof-id b { display: block; overflow-wrap: anywhere; }
.prof-id span:not(.avatar) { color: var(--dim); font-size: 13px; }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 24px; flex: none; }
.prow { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.prow:first-child { border-top: 0; }
.prow b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.sheet .tile .v { font-size: 34px; }
.trow .lbl.long { font-size: 15px; letter-spacing: .06em; }
.stweek { display: flex; gap: 8px; }
.stweek span { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--dim); }
.stweek span.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.stweek span.td { outline: 2px solid var(--dim); outline-offset: 2px; }
.strow { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: start; border-top: 1px solid var(--line); padding: 12px 0; }
.stck { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--accent-ink); display: grid; place-items: center; }
.stck::after { content: ''; width: 9px; height: 17px; border: solid currentColor; border-width: 0 4px 4px 0; transform: rotate(45deg) translate(-2px, -2px); opacity: 0; }
.stck[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.stck[aria-pressed="true"]::after { opacity: 1; }
.stgo { text-align: left; background: none; border: 0; color: var(--ink); padding: 2px 0; min-height: 44px; }
.stgo b { display: block; font-weight: 700; }
.stgo span { display: block; color: var(--dim); font-size: 13px; line-height: 1.4; margin-top: 2px; }
.stgo .sth { color: var(--ink); font-weight: 600; }
.st-lbl { font-size: 13px; letter-spacing: .12em; font-weight: 700; color: var(--dim); }
.st-t { font-family: var(--font-display); font-weight: 800; font-size: 96px; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; padding: 8px 0; }
.st-t.hold { color: var(--accent); }
.st-prog { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.st-prog span { display: block; height: 100%; background: var(--accent); width: 100%; }
.st-cue { margin: 0; color: var(--dim); line-height: 1.45; }
.st-btns { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.st-btns .btn { padding-left: 4px; padding-right: 4px; }
.ltips { margin: 6px 0 0; padding-left: 18px; color: var(--dim); font-size: 14px; display: flex; flex-direction: column; gap: 6px; }

/* header */
.top { display: flex; align-items: center; gap: 12px; padding: 4px 0 2px; }
.brand { min-width: 0; }
.top h1 { font-family: var(--font-display); font-weight: 800; font-size: 28px; letter-spacing: .06em; line-height: 1; border-bottom: 3px solid var(--accent); padding-bottom: 3px; white-space: nowrap; }
.tag { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin-top: 4px; white-space: nowrap; }
.rec { margin-left: auto; text-align: right; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-variant-numeric: tabular-nums; }
.rec b { font-family: var(--font-display); font-size: 24px; letter-spacing: .04em; color: var(--ink); font-weight: 800; }
.rbr { display: block; height: 0; }
@media (max-width: 430px) {
  .top { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; column-gap: 8px; row-gap: 2px; }
  .top h1 { font-size: 26px; letter-spacing: .05em; }
  .tag { display: none; }
  .brand { grid-column: 1; grid-row: 1; }
  .rec { grid-column: 1; grid-row: 2; margin-left: 0; text-align: left; font-size: 11px; letter-spacing: .1em; }
  .rec b { font-size: 18px; }
  .rbr { display: inline; }
  .rbr::before { content: '\00a0\00b7\00a0'; }
  #prof { grid-column: 2; grid-row: 1 / span 2; }
  #gear { grid-column: 3; grid-row: 1 / span 2; }
}
@media (max-width: 350px) { .top h1 { font-size: 21px; } }
.icon-btn { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; width: 40px; height: 40px; display: grid; place-items: center; color: var(--dim); }
.icon-btn:hover { color: var(--ink); }

/* cards */

/* game clock */
.clock-card { padding: 0; overflow: hidden; }
.bar-top { display: flex; justify-content: space-between; gap: 12px; background: var(--panel-2); border-bottom: 1px solid var(--line); padding: 9px 16px; font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }

.center { align-items: stretch; text-align: center; }
.clock { font-family: var(--font-display); font-weight: 800; line-height: .9; font-size: clamp(96px, 30vw, 176px); color: var(--accent); white-space: nowrap; }

[data-zone="late"] .clock { color: var(--bad-t); }
.dwrap { position: relative; margin-top: 18px; }
.drain { height: 10px; background: var(--panel-2); border-radius: 5px; overflow: hidden; }
.drain i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
[data-zone="win"] .drain i { background: var(--warn-t); }
[data-zone="late"] .drain i { background: var(--lost); }
.dmark { position: absolute; left: 75%; top: -4px; bottom: -4px; width: 2px; background: var(--ink); opacity: .75; }
.dlab { position: absolute; left: 75%; top: -20px; transform: translateX(-50%); font-size: 11px; font-weight: 600; letter-spacing: .14em; color: var(--dim); white-space: nowrap; }
.drow { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; align-items: center; }
.drow .chip { min-width: 0; width: 100%; }
.drow input[type="time"]:disabled { opacity: .35; }
.gl.elite { stroke: var(--elite); stroke-dasharray: 2 3; stroke-width: 1.5; }
.onLine { font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-variant-numeric: tabular-nums; }
.onLine b { font-family: var(--font-display); font-size: 30px; color: var(--ink); letter-spacing: .02em; margin-right: 2px; }
.cta { width: 100%; min-height: 88px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-weight: 800; font-size: 44px; letter-spacing: .08em; }

.hint { color: var(--dim); font-size: 14px; }
.targets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.targets div { background: var(--panel-2); border-radius: 8px; padding: 8px 6px; }
.targets span { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.targets b { font-family: var(--font-display); font-size: 24px; font-weight: 800; letter-spacing: .03em; font-variant-numeric: tabular-nums; }
.countdown { font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; padding: 3px 10px; border-radius: 99px; color: var(--on-fill); }
.bg-elite { background: var(--elite); } .bg-sharp { background: var(--sharp); } .bg-ontime { background: var(--ontime); }
.bg-late { background: var(--late); } .bg-lost { background: var(--lost); }
.res-line { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }

.facts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; color: var(--dim); font-size: 15px; }

.banner { background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: .14em; padding: 6px 10px; border-radius: 6px; }
.next { border-top: 1px solid var(--line); padding-top: 12px; font-size: 14px; color: var(--dim); }

/* stats */

/* chart */

#chart svg { display: block; width: 100%; height: auto; }
.ax { fill: var(--dim); font: 500 11px var(--font-body); }
.ax.today { fill: var(--ink); font-weight: 600; }
.ax.bad { fill: var(--bad-t); font-size: 14px; }
.gl { stroke: var(--line); stroke-width: 1; }
.gl.cut { stroke: var(--accent); stroke-dasharray: 5 4; stroke-width: 1.5; }
.f-elite { fill: var(--elite); } .f-sharp { fill: var(--sharp); } .f-ontime { fill: var(--ontime); }
.f-late { fill: var(--late); } .f-lost { fill: var(--lost); }

/* log */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)) 46px; gap: 4px; }
.cal.head { margin-bottom: 4px; }

.cell { position: relative; aspect-ratio: 1 / 1; min-height: 38px; border: 1px solid transparent; border-radius: 6px; background: var(--panel-2); padding: 0; display: grid; place-items: center; color: var(--on-fill); font-family: var(--font-display); font-weight: 800; font-size: 17px; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.cell i { position: absolute; top: 2px; left: 4px; font: 500 9px var(--font-body); font-style: normal; opacity: .75; }
.cell.c-elite { background: var(--elite); } .cell.c-sharp { background: var(--sharp); } .cell.c-ontime { background: var(--ontime); }
.cell.c-late { background: var(--late); } .cell.c-lost { background: var(--lost); }
.cell.c-miss { background: transparent; border-color: var(--lost); color: var(--bad-t); }
.cell.c-rest { background: transparent; border: 1px dashed var(--line); color: var(--dim); }

.cell.is-today { box-shadow: 0 0 0 2px var(--ink); }
.cell.c-rest i, .cell.c-miss i, .cell.c-pend i, .cell.c-pre i, .cell.c-future i { opacity: 1; color: var(--dim); }
.wk { display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 16px; color: var(--dim); border-radius: 6px; font-variant-numeric: tabular-nums; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 12px; color: var(--dim); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* form controls and modal */
.form { display: flex; flex-direction: column; gap: 14px; margin-bottom: 16px; }

input[type="time"], input[type="number"], input[type="text"], input[type="date"], input[type="email"], input[type="password"], select { width: 100%; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: 500 20px var(--font-body); min-height: 48px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.modal { position: fixed; inset: 0; background: rgba(5, 8, 12, .72); display: flex; align-items: center; justify-content: center; padding: 16px; padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 20; overflow-y: auto; }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.prev { min-height: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 0 18px; min-height: 46px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(20px, env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 500; z-index: 30; max-width: calc(100% - 32px); }
.rest { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 720px; z-index: 15; display: flex; align-items: center; gap: 10px; background: var(--panel-2); border-top: 1px solid var(--line); box-shadow: 0 -6px 18px rgba(0, 0, 0, .35); padding: 12px 14px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
.rest[hidden] { display: none; }
.rest-bar { position: absolute; left: 0; top: 0; height: 3px; width: 0; background: var(--accent); transition: width .25s linear; }

.rest.done { background: var(--elite); border-top-color: var(--elite); color: var(--on-fill); }
.rest.done .rest-what, .rest.done .rest-what b { color: var(--on-fill); }

body.rest-on .wrap { padding-bottom: 100px; }

.bwdays { display: flex; gap: 6px; }

@media (prefers-reduced-motion: reduce) { .rest-bar { transition: none; } }
.foot { text-align: center; color: var(--dim); font-size: 12px; letter-spacing: .04em; padding-top: 4px; }

.tabbtn { min-height: 46px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--dim); font-family: var(--font-display); font-weight: 800; font-size: 16px; letter-spacing: .06em; }

.tab { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.clock.xs { font-size: clamp(56px, 17vw, 96px); }

.rows2 { display: flex; flex-direction: column; }

.trio { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

/* reading plan */

.phead .what { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: .12em; }
.ptrack { height: 10px; background: var(--panel-2); border-radius: 5px; overflow: hidden; margin: 10px 0 6px; }
.ptrack i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.plist { display: flex; flex-direction: column; margin-top: 4px; }

/* plan points, mode picker, takeaways */

textarea { width: 100%; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: 400 16px/1.4 var(--font-body); resize: vertical; min-height: 84px; }

/* books */

.brow .open { background: none; border: 0; padding: 0; text-align: left; color: var(--ink); min-width: 0; min-height: 44px; }

.bar { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; margin: 6px 0 2px; }

  /* ---------- model ---------- */
  function avgOf(arr) {
    var e = arr.filter(function (x) { return x.e; });

  }
  function model() {
    if (!settings) return null;
    var now = new Date(), tk = dkey(now);
    var start = settings.startDate;
    var keys = Object.keys(checkins).sort();
    if (keys.length && keys[0] < start) start = keys[0];
    if (start > tk) start = tk;
    var aStr = alarmFor(now.getDay());
    var todayClosed = aStr ? (now - alarmAt(tk, aStr)) / 1000 > END : false;
    var days = [], byKey = {};
    for (var d = fromKey(start); dkey(d) <= tk; d = addDays(d, 1)) {
      var k = dkey(d), e = checkins[k] || null, active = settings.days.indexOf(d.getDay()) >= 0, st;
      if (e) st = e.win ? 'win' : 'loss';
      else if (k < tk) st = active ? 'miss' : 'rest';
      else st = !active ? 'rest' : (todayClosed ? 'miss' : 'pending');
      var o = { k: k, d: d, e: e, active: active, st: st };
      days.push(o); byKey[k] = o;
    }
    var w = 0, l = 0, ptsT = 0, run = 0, best = 0, bestEnd = null, elite = 0, fastest = null;
    days.forEach(function (x) {
      if (x.st === 'win') { w++; run++; if (run > best) { best = run; bestEnd = x.k; } }
      else if (x.st === 'loss' || x.st === 'miss') { l++; run = 0; }
      if (x.e) {
        ptsT += x.e.points;
        if (x.e.seconds <= 30) elite++;
        if (!fastest || x.e.seconds < fastest.seconds) fastest = { seconds: x.e.seconds, k: x.k };
      }
    });
    var weeks = {};
    days.forEach(function (x) {
      var wk = dkey(weekStart(x.d));
      var o = weeks[wk] || (weeks[wk] = { wins: 0 });
      if (x.st === 'win') o.wins++;
    });
    var curWk = dkey(weekStart(now));
    var weekWins = (weeks[curWk] || { wins: 0 }).wins;
    var bestWeek = 0, bestWeekKey = null, weeksHit = 0;
    Object.keys(weeks).sort().forEach(function (k) {
      var v = weeks[k].wins;
      if (v > bestWeek) { bestWeek = v; bestWeekKey = k; }
      if (v >= settings.weeklyTarget) weeksHit++;
    });
    var weekLeft = 0;
    for (var i = 0; i < 7; i++) {
      var dd = addDays(now, i);
      if (((dd.getDay() + 6) % 7) < ((now.getDay() + 6) % 7)) break;
      if (settings.days.indexOf(dd.getDay()) < 0) continue;
      var kk = dkey(dd);

    }

    var best7 = null;
    for (var j = 6; j < days.length; j++) {
      var a = avgOf(days.slice(j - 6, j + 1));
      if (a && a.n >= 4 && (!best7 || a.avg < best7.avg)) best7 = { avg: a.avg, end: days[j].k };
    }
    var w30 = 0, l30 = 0, e30 = 0;
    days.slice(-30).forEach(function (x) { if (x.st === 'win') w30++; else if (x.st === 'loss' || x.st === 'miss') l30++; if (x.e && x.e.seconds <= 30) e30++; });
    return {
      now: now, tk: tk, days: days, byKey: byKey, start: start, w: w, l: l, ptsT: ptsT, streak: run, best: best, bestEnd: bestEnd,
      elite: elite, fastest: fastest, weekWins: weekWins, weekLeft: weekLeft, bestWeek: bestWeek, bestWeekKey: bestWeekKey,
      weeksHit: weeksHit, last7: last7, prev7: prev7, last30: last30, best7: best7, w30: w30, l30: l30, e30: e30

  }

  function phase() {

    if (!(min >= 1 && min <= 720)) { toast('Enter minutes, 1 to 720.'); return; }
    if (!(pg >= 1 && pg <= 2000)) { toast('Enter pages, 1 to 2000.'); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || date > tk) { toast('Pick today or an earlier date.'); return; }
    var old = readEdit ? reads[readEdit] : null, roll = 1;
    if (!old && date === tk) { var x = Math.random(); roll = x < 0.08 ? 2 : x < 0.3 ? 1.5 : 1; }
    var rec = {
      id: old ? old.id : newId('s'), bookId: bid, title: bid && books[bid] ? books[bid].title : (old && old.bookId === bid ? old.title : ''),
      date: date, minutes: min, pages: pg, fmt: sheetFmt, lucky: old ? old.lucky : roll, at: old ? old.at : new Date().toISOString()
    };
    reads[rec.id] = rec;
    fmtSel = sheetFmt; lastBook = bid;
    try { localStorage.setItem(LS + '.fmt', fmtSel); localStorage.setItem(LS + '.book', lastBook); } catch (e) {}
    var fin = null, b = bid ? books[bid] : null, started = null;
    if (b && b.queued) { b.queued = false; started = b; }
    if (b && !b.done && bookPages(bid) >= b.pages) { b.done = true; b.doneDate = date; fin = b; }
    closeModal();
    readPop = !old && date === tk;
    renderAll();
    var pts = readModel().ptsOf[rec.id];
    toast(fin ? 'Finished ' + fin.title + '! +' + (pts + FINISH) + ' pts' : '+' + pts + ' pts' + (rec.lucky === 2 ? ' (jackpot, double!)' : rec.lucky > 1 ? ' (lucky +50%)' : ''));
    await persist(async function (d) {
      await d.doc('reads/' + rec.id).set(rec);
      if (fin) await d.doc('books/' + fin.id).set(fin);
      else if (started) await d.doc('books/' + started.id).set(started);
    });
  }
  async function deleteRead(id) {
    delete reads[id];
    closeModal();
    renderAll();
    toast('Session deleted.');
    await persist(function (d) { return d.doc('reads/' + id).delete(); });
  }

  /* ---------- live ticking ---------- */
  function tick() {
    if (!settings && sig === '') { renderAll(); return; }
    var ph = phase();
    var s = ph.p + '|' + dkey(new Date());
    if (s !== sig) { renderAll(); if (ph.p === 'live') autoWake(); return; }
    if (ph.p === 'live') {
      var sc = scored(ph.diff), str = fmt(sc), clk = $('#clk');
      if (clk && str !== lastClk) {
        lastClk = str;
        clk.innerHTML = digits(str);
        clk.className = clkClass(str);
        $('#drain').style.width = drainW(sc) + '%';
        $('#onLine').innerHTML = lineText(sc);
        $('#liveBox').setAttribute('data-zone', zoneOf(sc));
      }
    } else if (ph.p === 'wait') {
      var cd = $('#cd');
      if (cd) cd.textContent = cdText(ph.diff);
    }
  }

    h += profTry(function () {
      var hb = hModel('bible');
      return profBlock('BIBLE', profTile('Days read', hb.total, 'all time') + profTile('This week', hb.weekCount + '/' + hb.target, 'goal') + profTile('Best streak', hb.best, 'days') + profTile('30 days', hb.rate30 === null ? 'n/a' : hb.rate30 + '%', 'days read'));
    });
    h += profTry(function () {
      var rd = readModel();
      return profBlock('BOOKS', profTile('Finished', rd.finished, rd.finYear + ' this year') + profTile('Minutes read', rd.totMin.toLocaleString('en-US'), profHM(rd.totMin)) + profTile('Pages', rd.totPg.toLocaleString('en-US'), 'logged') + profTile('This week', rd.weekMin, 'minutes'));
    });
    h += profTry(function () {
      var m = curModel;
      if (!m) return '';
      return profBlock('WAKE', profTile('Wins', m.w, m.l + ' losses') + profTile('Best streak', m.best, 'wins in a row') + profTile('Fastest', m.fastest ? fmt(m.fastest.seconds) : 'n/a', m.fastest ? dateLabel(m.fastest.k) : '') + profTile('Elite', m.elite, 'under 0:30'));
    });
    h += '<div class="row" style="margin-top:18px">' + (fbOn() ? '<button class="btn" data-action="fb-signout">Sign out</button>' : '') + '<button class="btn primary" data-action="close-modal">Close</button></div>';
    return h;
  }
  function profOpen() { openModal(profileHTML()); }

  /* ---------- modal ---------- */
  function openModal(html, focusSel) {
    $('#sheet').innerHTML = html;
    $('#modal').hidden = false;
    var f = focusSel && $(focusSel);
    if (f) f.focus();
  }
  function closeModal() {
    stCleanup();
    if (planSheet !== null) { saveNotes(); planSheet = null; }
    readEdit = null;
    $('#modal').hidden = true; $('#sheet').innerHTML = '';
  }
  function editHTML(k) {
    var e = checkins[k], d = fromKey(k), title = DOW[d.getDay()] + ', ' + MON[d.getMonth()] + ' ' + d.getDate();
    var mm = e ? Math.floor(e.seconds / 60) : '', ss = e ? e.seconds % 60 : '';
    return '<h3>' + title + '</h3><p class="dim">' + (e ? 'Edit this morning.' : 'Log this morning.') + ' Enter how long after your alarm your feet hit the floor.</p>' +
      '<div class="two"><label class="fld"><span>MINUTES</span><input id="e-min" type="number" inputmode="numeric" min="0" max="180" value="' + mm + '"></label>' +
      '<label class="fld"><span>SECONDS</span><input id="e-sec" type="number" inputmode="numeric" min="0" max="59" value="' + ss + '"></label></div>' +
      '<div class="prev" id="e-prev"></div>' +
      '<div class="row"><button class="btn primary" data-action="save-entry" data-key="' + k + '">Save</button>' +
      (e ? '<button class="btn danger" data-action="clear-entry" data-key="' + k + '">Clear</button>' : '') +
      '<button class="btn" data-action="close-modal">Cancel</button></div>';
  }
  function entrySeconds() {
    var mi = $('#e-min').value, se = $('#e-sec').value;
    if (mi === '' && se === '') return null;
    var t = (parseInt(mi || '0', 10) || 0) * 60 + (parseInt(se || '0', 10) || 0);
    return t >= 0 && t <= END ? t : null;
  }
  function updatePrev() {
    var p = $('#e-prev');
    if (!p) return;
    var t = entrySeconds();
    if (t === null) { p.textContent = 'Enter a time between 0:00 and 3:00:00.'; return; }
    var ti = tierOf(t);
    p.textContent = fmt(t) + '  ·  ' + ti.label + '  ·  ' + pts(t) + ' pts  ·  ' + (t <= WIN ? 'Win' : 'Loss');
  }

  document.addEventListener('click', function (ev) {
    if (ev.target.id === 'modal') { if (stBusy()) return; closeModal(); return; }
    var b = ev.target.closest('[data-action]');
    if (!b) return;
    var a = b.dataset.action;
    if ((a.indexOf('lift-') === 0 || a.indexOf('lp-') === 0 || a === 'ad-type') && liftAction(a, b)) { if (gwk) gwkShow(); return; }
    if (a.indexOf('run-') === 0 && runAction(a, b)) return;
    if (a.indexOf('bw-') === 0 && bwAction(a, b)) return;
    if (a.indexOf('st-') === 0 && stAction(a, b)) return;
    if (a.indexOf('gw-') === 0 && gwkAction(a, b)) return;
    if (a.indexOf('fb-') === 0 && fbAction(a, b)) return;
    if (a === 'open-profile') { profOpen(); return; }
    if (a === 'wake-up') {
      if (writing) return;
      var ph = phase();
      if (ph.p !== 'live') return;
      writing = true;
      var secs = Math.max(1, Math.round(scored((new Date() - ph.aT) / 1000)));
      justSaved = true;
      saveEntry(ph.k, secs, false).finally(function () { writing = false; });
    } else if (a === 'toggle-day') {
      var n = parseInt(b.dataset.d, 10);
      if (formDays.has(n)) formDays.delete(n); else formDays.add(n);
      b.setAttribute('aria-pressed', formDays.has(n));
      $('#f-t-' + n).disabled = !formDays.has(n);
    } else if (a === 'tab') {
      setTab(b.dataset.tab);
    } else if (a === 'hab-toggle') {
      var hk = b.dataset.kind, hkey = b.dataset.key;
      if (!habits[hk][hkey] && hkey === dkey(new Date())) habPop = hk;
      toggleHabit(hk, hkey);
    } else if (a === 'rest-toggle') {
      restOn = !restOn;
      try { localStorage.setItem(LS + '.rest', restOn ? '1' : '0'); } catch (e) {}
      if (!restOn) restStop();
      renderAll();
      toast('Rest timer ' + (restOn ? 'on.' : 'off.'));
    } else if (a === 'rest-add') {
      restAdd(parseInt(b.dataset.s, 10));
    } else if (a === 'rest-skip') {
      restStop();
    } else if (a === 'fb-open') {
      fbPromptSignIn();
    } else if (a === 'fb-show') {
      fbShowPass(b);
    } else if (a === 'fb-reset') {
      fbReset();
    } else if (a === 'fb-signin') {
      fbAuth(false);
    } else if (a === 'fb-create') {
      fbMode('create');
    } else if (a === 'fb-mode-in') {
      fbMode('in');
    } else if (a === 'fb-signout') {
      if (fb) fb.A.signOut(fb.auth).then(function () { try { localStorage.removeItem(LS); } catch (e) {} location.reload(); });
    } else if (a === 'export') {
      exportBackup();
    } else if (a === 'import') {
      $('#imp-file').click();
    } else if (a === 'import-yes') {
      importApply();
    } else if (a === 'nv-open') {
      nv = true; renderAll(); try { window.scrollTo(0, 0); } catch (e) {}
    } else if (a === 'nv-close') {
      nv = false; nvQuery = ''; renderAll(); try { window.scrollTo(0, 0); } catch (e) {}
    } else if (a === 'nv-sort') {
      nvSort = b.dataset.s; renderAll();
    } else if (a === 'book-add') {
      openModal(bookSheetHTML(null), '#b-title');
    } else if (a === 'book-edit') {
      openModal(bookSheetHTML(b.dataset.id), '#b-title');
    } else if (a === 'book-save') {
      saveBook(b.dataset.id || null);
    } else if (a === 'book-open') {
      if (books[b.dataset.id]) openModal(bookDetailHTML(b.dataset.id));
    } else if (a === 'book-finish') {
      setBookDone(b.dataset.id, true);
    } else if (a === 'book-prior') {
      setBookDone(b.dataset.id, true, true);
    } else if (a === 'book-reopen') {
      setBookDone(b.dataset.id, false);
    } else if (a === 'book-remove') {
      var rb = books[b.dataset.id];
      if (rb) openModal('<h3>REMOVE BOOK?</h3><p>' + esc(rb.title) + ' comes off your shelf. Sessions you logged for it stay in your stats.</p><div class="row"><button class="btn danger" data-action="book-remove-yes" data-id="' + rb.id + '">Remove</button><button class="btn" data-action="close-modal">Cancel</button></div>');
    } else if (a === 'book-remove-yes') {
      removeBook(b.dataset.id);
    } else if (a === 'fin-toggle') {
      finOpen = !finOpen; renderAll();
    } else if (a === 'lib-toggle') {
      libOpen = !libOpen; renderAll();
    } else if (a === 'read-log') {
      openLog(null, b.dataset.book || '');
    } else if (a === 'read-edit') {
      if (reads[b.dataset.id]) openLog(b.dataset.id, '');
    } else if (a === 'read-save') {
      saveRead();
    } else if (a === 'read-delete') {
      deleteRead(b.dataset.id);
    } else if (a === 'r-fmt') {
      sheetFmt = b.dataset.f;
      Array.prototype.forEach.call(b.parentNode.querySelectorAll('.chip'), function (c) { c.setAttribute('aria-pressed', c === b ? 'true' : 'false'); });
    } else if (a === 'read-goal') {
      setReadGoal(goals.read + parseInt(b.dataset.n, 10));
    } else if (a === 'plan-open') {
      planOpen(parseInt(b.dataset.i, 10));
    } else if (a === 'plan-mode') {
      setPlanMode(parseInt(b.dataset.i, 10), b.dataset.mode);
    } else if (a === 'plan-clear') {
      clearPlan(parseInt(b.dataset.i, 10));
    } else if (a === 'plan-caught-up') {
      var pc = planModel().overdue.length;
      openModal('<h3>CAUGHT UP?</h3><p>This checks off all ' + pc + ' readings due through today. Only do this if you really have read them.</p>' +
        '<div class="row"><button class="btn primary" data-action="plan-caught-up-yes">Mark ' + pc + ' done</button><button class="btn" data-action="close-modal">Cancel</button></div>');
    } else if (a === 'plan-caught-up-yes') {
      planCaughtUp();
    } else if (a === 'goal') {
      var gk = b.dataset.kind;
      setGoal(gk, goals[gk] + parseInt(b.dataset.n, 10));
    } else if (a === 'keep-awake') {
      keepAwake(false);
    } else if (a === 'copy-time') {
      var src = ORDER.filter(function (x) { return formDays.has(x); })[0];
      if (src === undefined) { toast('Turn on at least one day first.'); return; }
      var tv = $('#f-t-' + src).value;
      ORDER.forEach(function (x) { $('#f-t-' + x).value = tv; });
    } else if (a === 'save-settings') {
      if (!formDays.size) { toast('Pick at least one game day.'); return; }
      var alarms = {}, bad = false;
      formDays.forEach(function (x) {
        var v = $('#f-t-' + x).value;
        if (!/^\d{2}:\d{2}$/.test(v)) bad = true; else alarms[x] = v;
      });
      if (bad) { toast('Set an alarm time for every active day.'); return; }
      var s = { alarms: alarms, days: Object.keys(alarms).map(Number), weeklyTarget: parseInt($('#f-target').value, 10) || 5, walk: parseInt($('#f-walk').value, 10) || 0, startDate: settings ? settings.startDate : dkey(new Date()) };
      closeModal();
      saveSettings(s);
    } else if (a === 'open-settings') {
      if (!settings) return;
      openModal('<h3>BOARD SETTINGS</h3>' + formHTML(settings) +
        '<div class="row"><button class="btn primary" data-action="save-settings">Save</button><button class="btn" data-action="close-modal">Cancel</button></div>', '#f-t-1');
    } else if (a === 'edit') {
      openModal(editHTML(b.dataset.key), '#e-min');
      updatePrev();
    } else if (a === 'save-entry') {
      var t = entrySeconds();
      if (t === null) { toast('Enter a time between 0:00 and 3:00:00.'); return; }
      closeModal();
      saveEntry(b.dataset.key, t, true);
    } else if (a === 'clear-entry') {
      closeModal();
      removeEntry(b.dataset.key);
    } else if (a === 'close-modal') {
      closeModal();
    }
  });
  document.addEventListener('input', function (ev) {
    if (ev.target.id === 'e-min' || ev.target.id === 'e-sec') updatePrev();
    if (ev.target.id === 'n-search') { nvQuery = ev.target.value; renderNotesView(); }
    if (ev.target.id === 'r-min' || ev.target.id === 'r-pg' || ev.target.id === 'r-date') updateReadPrev();
  });
  document.addEventListener('change', function (ev) {
    if (ev.target.id !== 'imp-file') return;
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    f.text().then(importChosen, function () { toast('Could not read that file.'); });
    ev.target.value = '';
  });
  document.addEventListener('submit', function (ev) {
    if (ev.target && ev.target.id === 'gate-form') { ev.preventDefault(); fbAuth(gateMode === 'create'); }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && !$('#modal').hidden) closeModal();
  });
  var wl = null, wantAwake = false, awake = false;
  async function keepAwake(silent) {
    wantAwake = true;
    try {
      if (!navigator.wakeLock) throw new Error('unsupported');
      wl = await navigator.wakeLock.request('screen');
      awake = true;
      wl.addEventListener('release', function () { awake = false; renderAll(); });
      renderAll();
    } catch (e) {
      awake = false;
      if (!silent) toast('This phone would not keep the screen on. Set auto-lock to Never while it charges, or the page may not be ready in the morning.');
    }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    tick();
    if (wantAwake && !awake) keepAwake(true);
  });
  if (window.ResizeObserver) new ResizeObserver(function () { drawChart(); }).observe($('#chart'));

  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  loadLocal();
  try { var f0 = localStorage.getItem(LS + '.fmt'); if (FMT[f0]) fmtSel = f0; lastBook = localStorage.getItem(LS + '.book') || ''; } catch (e) {}
  try { var st0 = localStorage.getItem(LS + '.tab'); if (['home', 'wake', 'bible', 'books', 'gym', 'run'].indexOf(st0) >= 0) tab = st0; } catch (e) {}
  renderAll();
  setTab(tab);
  autoWake();
  setInterval(tick, 250);
  connect();
})();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
